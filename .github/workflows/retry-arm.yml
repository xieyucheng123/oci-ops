name: Retry ARM Instance Creation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  retry-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: retry-arm
      cancel-in-progress: false
    steps:
      - name: Install OCI CLI
        run: |
          pip install oci-cli --quiet

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << 'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          region=${{ secrets.OCI_CLI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config

      - name: Check if vm-arm already exists
        id: check
        run: |
          TENANCY="${{ secrets.OCI_CLI_TENANCY }}"
          EXISTING=$(oci compute instance list --compartment-id "$TENANCY" --all --no-retry --query 'data[?"display-name"==`vm-arm` && "lifecycle-state"==`RUNNING`] | length(@)' --raw-output 2>/dev/null || echo "0")
          if [ "$EXISTING" != "0" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "vm-arm already running, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Find latest Ubuntu 24.04 ARM image
        if: steps.check.outputs.exists == 'false'
        id: image
        run: |
          TENANCY="${{ secrets.OCI_CLI_TENANCY }}"
          IMAGE_ID=$(oci compute image list \
            --compartment-id "$TENANCY" \
            --shape VM.Standard.A1.Flex \
            --all \
            --no-retry \
            --query 'data[?contains("display-name",`Canonical-Ubuntu-24.04-aarch64`) && !contains("display-name",`Minimal`)] | sort_by(@, &"time-created") | [-1].id' \
            --raw-output)
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "Selected image: $IMAGE_ID"

      - name: Try launch ARM instance (120s poll loop, ~6h, 150 attempts)
        if: steps.check.outputs.exists == 'false'
        id: launch
        run: |
          TENANCY="${{ secrets.OCI_CLI_TENANCY }}"
          AD_NAME="NhMH:AP-TOKYO-1-AD-1"
          SUBNET_ID="ocid1.subnet.oc1.ap-tokyo-1.aaaaaaaau2qogsvj4ripqfh6yljlczb637bi2vtbbprjbox67c2il52s36qa"
          IMAGE_ID="${{ steps.image.outputs.image_id }}"
          # ~135s base interval: 150 attempts x ~140s ≈ 5.8h, fits in the
          # 355min job timeout. Existence re-check runs every 10th attempt
          # to halve API usage and stay clear of rate limits.
          MAX_ATTEMPTS=150
          SLEEP_BASE=120

          # Write metadata to file
          python3 -c "
          import json
          ssh_key = '${{ secrets.OCI_SSH_PUBLIC_KEY }}'
          with open('/tmp/metadata.json','w') as f:
              json.dump({'ssh_authorized_keys': ssh_key}, f)
          "

          parse_error() {
            echo "$1" | sed 's/^ServiceError://' | tr -d '\n' | python3 -c "
          import json,sys
          raw = sys.stdin.read().strip()
          idx = raw.find('{')
          if idx >= 0:
              try:
                  d = json.loads(raw[idx:])
                  print(json.dumps({'code': d.get('code','Unknown'), 'message': d.get('message','No message')}))
              except:
                  print(json.dumps({'code': 'Unknown', 'message': raw[:200]}))
          else:
              print(json.dumps({'code': 'Unknown', 'message': raw[:200]}))
          " 2>/dev/null || echo '{"code":"Unknown","message":"Parse failed"}'
          }

          for i in $(seq 1 $MAX_ATTEMPTS); do
            # Alternate shapes: odd attempts try 2C/12G, even attempts fall back
            # to 1C/6G to catch fragment capacity, then scale up later.
            if [ $((i % 2)) -eq 0 ]; then
              SHAPE_CONFIG='{"ocpus": 1, "memory-in-gbs": 6}'
              SHAPE_LABEL='1 OCPU / 6GB'
            else
              SHAPE_CONFIG='{"ocpus": 2, "memory-in-gbs": 12}'
              SHAPE_LABEL='2 OCPU / 12GB'
            fi
            echo "=== Attempt $i/$MAX_ATTEMPTS $(date -u +%FT%TZ) [$SHAPE_LABEL] ==="

            # Re-check every 10th attempt: vm-arm may have appeared mid-run
            # (manual create or prior run). Skipped otherwise to save API quota.
            if [ $((i % 10)) -eq 1 ]; then
              EXISTING=$(oci compute instance list --compartment-id "$TENANCY" --all --no-retry --query 'data[?"display-name"==`vm-arm` && "lifecycle-state"==`RUNNING`] | length(@)' --raw-output 2>/dev/null || echo "0")
              if [ "$EXISTING" != "0" ]; then
                echo "vm-arm already running, exiting loop"
                echo "status=already_exists" >> $GITHUB_OUTPUT
                break
              fi
            fi

            # Try to launch (allow failure to capture error; --no-retry so our loop controls the interval)
            set +e
            LAUNCH_OUTPUT=$(oci compute instance launch \
              --compartment-id "$TENANCY" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "$SHAPE_CONFIG" \
              --display-name "vm-arm" \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --metadata file:///tmp/metadata.json \
              --no-retry 2>&1)
            LAUNCH_EXIT=$?
            set -e

            if [ $LAUNCH_EXIT -eq 0 ]; then
              INSTANCE_ID=$(echo "$LAUNCH_OUTPUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['id'])")
              echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
              echo "shape_label=$SHAPE_LABEL" >> $GITHUB_OUTPUT
              echo "status=success" >> $GITHUB_OUTPUT
              echo "Instance launched ($SHAPE_LABEL): $INSTANCE_ID"
              break
            fi

            ERROR_JSON=$(parse_error "$LAUNCH_OUTPUT")
            ERROR_CODE=$(echo "$ERROR_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('code','Unknown'))")
            ERROR_MSG=$(echo "$ERROR_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('message','No message'))")
            echo "Attempt $i failed: $ERROR_CODE - $ERROR_MSG"

            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "error_code=$ERROR_CODE" >> $GITHUB_OUTPUT
              echo "error_msg=$ERROR_MSG" >> $GITHUB_OUTPUT
              if echo "$ERROR_CODE" | grep -qi "InternalError"; then
                echo "status=no_capacity" >> $GITHUB_OUTPUT
              elif echo "$ERROR_CODE" | grep -qi "TooManyRequests"; then
                echo "status=rate_limited" >> $GITHUB_OUTPUT
              elif echo "$ERROR_CODE" | grep -qi "Unknown"; then
                # Empty/unparsed output (e.g. CLI timeout): treat as retryable,
                # don't spam error issues.
                echo "status=no_capacity" >> $GITHUB_OUTPUT
              else
                echo "status=error" >> $GITHUB_OUTPUT
              fi
              echo "Max attempts reached, exiting loop"
              break
            fi

            if echo "$ERROR_CODE" | grep -qi "TooManyRequests"; then
              BACKOFF=$((300 + RANDOM % 60))
              echo "Rate limited, backing off ${BACKOFF}s"
              sleep $BACKOFF
            elif echo "$ERROR_CODE" | grep -qi "InternalError"; then
              sleep $((SLEEP_BASE + RANDOM % 30))
            elif echo "$ERROR_CODE" | grep -qi "Unknown"; then
              # Transient CLI/network hiccup, retry with normal interval
              sleep $((SLEEP_BASE + RANDOM % 30))
            else
              # Non-retryable error (auth, bad OCID, quota, etc.): stop immediately
              echo "error_code=$ERROR_CODE" >> $GITHUB_OUTPUT
              echo "error_msg=$ERROR_MSG" >> $GITHUB_OUTPUT
              echo "status=error" >> $GITHUB_OUTPUT
              echo "Non-retryable error, exiting loop"
              break
            fi
          done

      - name: Wait for instance running and get IP
        if: steps.launch.outputs.status == 'success'
        id: ip
        run: |
          TENANCY="${{ secrets.OCI_CLI_TENANCY }}"
          INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"

          # Wait for RUNNING state
          for i in $(seq 1 60); do
            STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)
            echo "[$((i*5))s] State: $STATE"
            if [ "$STATE" = "RUNNING" ]; then
              break
            fi
            if [ "$STATE" = "TERMINATED" ] || [ "$STATE" = "TERMINATING" ]; then
              echo "Instance terminated unexpectedly!"
              echo "public_ip=unknown" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 5
          done

          # Get public IP
          VNIC_ID=$(oci compute vnic-attachment list \
            --compartment-id "$TENANCY" \
            --instance-id "$INSTANCE_ID" \
            --query 'data[0]."vnic-id"' --raw-output 2>/dev/null)
          PUBLIC_IP=$(oci network vnic get \
            --vnic-id "$VNIC_ID" \
            --query 'data."public-ip"' --raw-output 2>/dev/null)
          PRIVATE_IP=$(oci network vnic get \
            --vnic-id "$VNIC_ID" \
            --query 'data."private-ip"' --raw-output 2>/dev/null)

          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "private_ip=$PRIVATE_IP" >> $GITHUB_OUTPUT
          echo "Public IP: $PUBLIC_IP, Private IP: $PRIVATE_IP"

      - name: Create success issue and disable workflow
        if: steps.launch.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const publicIp = '${{ steps.ip.outputs.public_ip }}';
            const privateIp = '${{ steps.ip.outputs.private_ip }}';
            const instanceId = '${{ steps.launch.outputs.instance_id }}';
            const shapeLabel = '${{ steps.launch.outputs.shape_label }}' || '2 OCPU / 12GB';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'ARM Instance Created Successfully!',
              body: [
                '## ARM Instance vm-arm is RUNNING',
                '',
                `| Item | Value |`,
                `|------|-------|`,
                `| Instance ID | \`${instanceId}\` |`,
                `| Public IP | \`${publicIp}\` |`,
                `| Private IP | \`${privateIp}\` |`,
                `| Shape | VM.Standard.A1.Flex (${shapeLabel}) |`,
                `| Region | ap-tokyo-1 |`,
                `| Image | Ubuntu 24.04 aarch64 |`,
                '',
                '### SSH Access',
                '```bash',
                `ssh -i ~/.ssh/id_ed25519 ubuntu@${publicIp}`,
                '```',
                '',
                'Workflow has been automatically disabled.',
              ].join('\n'),
              labels: ['success']
            });

            // Disable the workflow
            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'retry-arm.yml'
            });

      - name: Round summary
        # Always runs: makes no_capacity / rate_limited / skipped visible on the
        # run page instead of guessing from a bare "success" conclusion.
        if: always()
        env:
          VM_EXISTS: ${{ steps.check.outputs.exists }}
          ROUND_STATUS: ${{ steps.launch.outputs.status }}
          ROUND_INSTANCE: ${{ steps.launch.outputs.instance_id }}
          ROUND_SHAPE: ${{ steps.launch.outputs.shape_label }}
          ROUND_ERR_CODE: ${{ steps.launch.outputs.error_code }}
          ROUND_ERR_MSG: ${{ steps.launch.outputs.error_msg }}
        run: |
          {
            echo "## Retry round: $(date -u +%FT%TZ)"
            echo ""
            if [ "$VM_EXISTS" = "true" ]; then
              echo "- Result: **skipped** (vm-arm already RUNNING)"
            elif [ "$ROUND_STATUS" = "success" ]; then
              echo "- Result: **created** \`$ROUND_INSTANCE\` ($ROUND_SHAPE)"
            elif [ "$ROUND_STATUS" = "already_exists" ]; then
              echo "- Result: **already exists** (appeared mid-run)"
            elif [ -n "$ROUND_STATUS" ]; then
              echo "- Result: \`$ROUND_STATUS\` (150 attempts, no capacity)"
              if [ -n "$ROUND_ERR_CODE" ]; then
                echo "- Last error: \`$ROUND_ERR_CODE\` — $ROUND_ERR_MSG"
              fi
            else
              echo "- Result: \`unknown\` (launch step did not run)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create error issue
        if: steps.launch.outputs.status == 'error'
        uses: actions/github-script@v7
        with:
          script: |
            const errorCode = '${{ steps.launch.outputs.error_code }}';
            const errorMsg = '${{ steps.launch.outputs.error_msg }}';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ARM Launch Error: ${errorCode}`,
              body: [
                '## Unexpected error launching ARM instance',
                '',
                `**Error Code:** \`${errorCode}\``,
                `**Error Message:** ${errorMsg}`,
                '',
                'Workflow will continue retrying on next schedule.',
              ].join('\n'),
              labels: ['error']
            });
